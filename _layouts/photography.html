<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="{{ post.author }}" />
    <title>{{ page.title }}</title>
    {% include css.html %}
    <link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="css/photography.css"/>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">turbo</a>
        <a href="/cv">cv</a>
        <a href="/about">about</a>
      </nav>
    </header>
    <article>
      {% assign id = page.name | split: "." | first %}

      <dialog id="overlay-{{ id }}" class="overlay">
        <button 
          class="overlay-open overlay-close" 
          commandfor="overlay-{{ id }}"
          command="close">
          <img src="{{ page.src }}" alt="{{ page.title }}" />
          <span>Click anywhere to close</span>
        </button>
      </dialog>

      <button 
        class="overlay-open"
        commandfor="overlay-{{ id }}"
        command="show-modal">
        <img src="{{ page.src }}" alt="{{ page.title }}" />
      </button>
      {{ content }}
    </article>
    <footer>
    </footer>
  </body>
<html>
